name: Deploy para staging (GCP)

on:
  push:
    branches:
      - staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências e build do shared
        run: |
          npm ci
          npm run build -w shared
          npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Copiar ficheiros para VM via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='node_modules' --exclude='frontend/node_modules' --exclude='backend/node_modules' --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' --exclude='backend/.env'
          path: ./
          remote_path: /home/${{ secrets.GCP_USER }}/carrinho-compras-staging
          remote_host: ${{ secrets.GCP_HOST }}
          remote_user: ${{ secrets.GCP_USER }}
          remote_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Criar .env e reiniciar servidor de staging na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            echo "${{ secrets.ENV_FILE_STAGING }}" > ~/carrinho-compras-staging/backend/.env
            chmod 600 ~/carrinho-compras-staging/backend/.env
            cd ~/carrinho-compras-staging/backend

            # Staging usa o mesmo container Postgres da produção (poupa
            # recursos na VM), mas uma base de dados à parte — nunca toca
            # nos dados de produção. O container já tem de estar a correr
            # (é gerido pelo deploy de produção).
            docker exec carrinho-compras-db psql -U carrinho -tc \
              "SELECT 1 FROM pg_database WHERE datname = 'carrinho_compras_staging'" | grep -q 1 || \
              docker exec carrinho-compras-db createdb -U carrinho carrinho_compras_staging

            NODE_OPTIONS="--max-old-space-size=512" npm ci --omit=dev --no-audit
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart carrinho-compras-staging || pm2 start dist/server.js --name carrinho-compras-staging --cwd ~/carrinho-compras-staging/backend
            pm2 save

            HEALTH_PORT=$(grep -m1 '^PORT=' .env | cut -d= -f2)
            HEALTH_PORT=${HEALTH_PORT:-3001}
            echo "A aguardar que a app de staging fique saudável em :${HEALTH_PORT}..."
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${HEALTH_PORT}/api/health" > /dev/null; then
                echo "Healthcheck OK"
                HEALTHY=true
                break
              fi
              sleep 3
            done
            if [ "$HEALTHY" != true ]; then
              echo "ERRO: healthcheck de staging falhou depois de reiniciar."
              pm2 logs carrinho-compras-staging --lines 50 --nostream || true
              exit 1
            fi
