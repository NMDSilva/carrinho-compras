name: Deploy para GCP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências e build do shared
        run: |
          npm ci
          npm run build -w shared
          npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Copiar ficheiros para VM via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='node_modules' --exclude='frontend/node_modules' --exclude='backend/node_modules' --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' --exclude='backend/.env'
          path: ./
          remote_path: /home/${{ secrets.GCP_USER }}/carrinho-compras
          remote_host: ${{ secrets.GCP_HOST }}
          remote_user: ${{ secrets.GCP_USER }}
          remote_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Criar .env e reiniciar servidor na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            # Heredoc com o delimitador citado ('ENV_EOF'): sem isto, um `$` ou
            # uma crase dentro de um segredo (JWT_SECRET, POSTGRES_PASSWORD,
            # N8N_API_KEY, RESEND_API_KEY) era expandido pelo bash da VM e o
            # .env ficava com um valor diferente do secret, em silêncio.
            cat <<'ENV_EOF' > ~/carrinho-compras/backend/.env
            ${{ secrets.ENV_FILE }}
            ENV_EOF
            chmod 600 ~/carrinho-compras/backend/.env
            cd ~/carrinho-compras/backend
            docker compose up -d
            NODE_OPTIONS="--max-old-space-size=512" npm ci --omit=dev --no-audit
            npx prisma generate

            # Backup imediatamente antes das migrações. Não há rollback
            # automático de migrations, e o único outro backup é o cron das
            # 03:15 — uma migração destrutiva a meio do dia podia custar quase
            # 24h de dados (AUDITORIA.md, 31/08/2026).
            #
            # O `docker compose up -d` acima devolve assim que os containers
            # arrancam, não quando o Postgres já aceita ligações — daí a espera,
            # senão o backup falhava por corrida e (com `set -e`) rebentava o
            # deploy. Se o Postgres não responder de todo, salta-se o backup com
            # aviso: não há nada para salvaguardar e a própria migração vai
            # falhar a seguir. Já um dump que arranque e falhe é fatal de
            # propósito — não se corre uma migração sem rede.
            chmod +x ~/carrinho-compras/backend/scripts/backup-db.sh
            PG_PRONTO=false
            for i in $(seq 1 20); do
              if docker compose exec -T postgres pg_isready -U carrinho -d carrinho_compras > /dev/null 2>&1; then
                PG_PRONTO=true
                break
              fi
              sleep 3
            done
            if [ "$PG_PRONTO" = true ]; then
              ./scripts/backup-db.sh
            else
              echo "AVISO: o Postgres não aceitou ligações — backup pré-migração saltado."
            fi

            npx prisma migrate deploy
            # "pm2 restart <nome>" e o fallback "pm2 start" podiam ambos falhar
            # quando o estado do pm2 fica inconsistente (dump.pm2 desatualizado
            # a apontar para um id que já não existe, mas com outro processo
            # pm2-managed a correr o mesmo script sob id/nome diferente —
            # "Process 0 not found" seguido de "Script already launched").
            # Apaga-se só o processo de produção, pelo nome, e não `pm2 delete
            # all`. Hoje esta VM só corre esta app, por isso os dois seriam
            # equivalentes — mas o `all` já apagou um segundo processo por
            # engano (o do staging, entretanto descontinuado) e o `delete` por
            # nome resolve a mesma inconsistência de estado do pm2 sem depender
            # de a VM continuar a correr uma app só.
            pm2 delete carrinho-compras 2>/dev/null || true
            pm2 start dist/server.js --name carrinho-compras --cwd ~/carrinho-compras/backend
            pm2 save

            HEALTH_PORT=$(grep -m1 '^PORT=' .env | cut -d= -f2)
            HEALTH_PORT=${HEALTH_PORT:-3000}
            echo "A aguardar que a app fique saudável em :${HEALTH_PORT}..."
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${HEALTH_PORT}/api/health" > /dev/null; then
                echo "Healthcheck OK"
                HEALTHY=true
                break
              fi
              sleep 3
            done
            if [ "$HEALTHY" != true ]; then
              echo "ERRO: healthcheck falhou depois de reiniciar — a app pode estar em baixo."
              pm2 logs carrinho-compras --lines 50 --nostream || true
              exit 1
            fi

            # (o chmod +x do backup-db.sh já foi feito antes das migrações)
            if command -v crontab >/dev/null 2>&1; then
              CRON_LINE="15 3 * * * cd ~/carrinho-compras/backend && ./scripts/backup-db.sh >> ~/backup-db.log 2>&1"
              (crontab -l 2>/dev/null | grep -vF 'backup-db.sh' || true; echo "$CRON_LINE") | crontab -
            else
              echo "AVISO: crontab não encontrado na VM — backup automático não agendado. Instala o pacote cron (ex.: sudo apt install -y cron) e volta a fazer deploy."
            fi
