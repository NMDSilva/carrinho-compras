name: Deploy para GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build
      
      - name: Criar .env na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > ~/carrinho-compras/backend/.env

      - name: Copiar ficheiros para VM via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='node_modules' --exclude='frontend/node_modules' --exclude='backend/node_modules'
          path: ./
          remote_path: /home/${{ secrets.GCP_USER }}/carrinho-compras
          remote_host: ${{ secrets.GCP_HOST }}
          remote_user: ${{ secrets.GCP_USER }}
          remote_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Instalar dependências e reiniciar servidor na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/carrinho-compras/backend
            npm ci --omit=dev
            npx prisma generate
            pm2 restart carrinho-compras || pm2 start dist/server.js --name carrinho-compras
            pm2 save