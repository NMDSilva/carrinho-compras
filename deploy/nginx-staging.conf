# vhost do nginx para o ambiente de STAGING (staging.carrinhodecompras.pt).
#
# Ao contrário do antigo `nginx.conf` que existia na raiz do repo (removido em
# 31/08/2026 por parecer a config real e não o ser), este ficheiro É para
# copiar: descreve um vhost que ainda não existe na VM, e é independente do de
# produção. Nunca substitui nada — cria um ficheiro novo.
#
# O deploy faz rsync do repo para ~/carrinho-compras na VM, por isso este
# ficheiro aparece lá sozinho a seguir a um push para `main`, em
# ~/carrinho-compras/deploy/nginx-staging.conf. Não é aplicado automaticamente:
# instalar é um passo manual, de uma só vez.
#
#   sudo cp ~/carrinho-compras/deploy/nginx-staging.conf \
#           /etc/nginx/sites-available/carrinho-compras-staging
#   sudo ln -s /etc/nginx/sites-available/carrinho-compras-staging \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes disto é preciso o DNS: registo `staging` na Cloudflare, CNAME para
# carrinhodecompras.pt, com o proxy ligado. O `nginx -t` passa sem DNS, mas o
# site só responde depois de o registo existir.
#
# ############################################################################
# # O PASSO DO TLS NÃO É OPCIONAL.                                           #
# ############################################################################
#
# Este ficheiro só declara `listen 80`. A Cloudflare liga-se à origem por 443,
# por isso enquanto não houver um bloco 443 para este hostname o pedido não
# encontra nenhum server block correspondente e o nginx entrega-o ao bloco por
# omissão da porta 443 — que é o de PRODUÇÃO. Sintoma traiçoeiro: o
# staging.carrinhodecompras.pt responde 200 e parece funcionar, mas está a
# servir a app e a base de dados de produção. Aconteceu a 03/09/2026.
#
# Detetou-se comparando cabeçalhos: a resposta trazia o conjunto de produção
# (com HSTS) e não trazia o `X-Robots-Tag` que este ficheiro define.
#
# Depois de instalar e recarregar, correr:
#
#   sudo certbot --nginx -d staging.carrinhodecompras.pt
#
# Certificado próprio para o subdomínio, de propósito — assim o certbot não tem
# motivo para tocar no ficheiro de produção. Ele acrescenta o `listen 443 ssl` e
# as linhas de certificado a ESTE ficheiro. Confirmar com
# `sudo nginx -T | grep -nE "listen|server_name"` que existe um `listen 443 ssl`
# junto ao `server_name staging.carrinhodecompras.pt`.
#
# `root` assume que o utilizador da VM é `silvanuno` — confirmar com `echo $HOME`
# antes de instalar.

server {
    listen 80;
    server_name staging.carrinhodecompras.pt;

    root /home/silvanuno/carrinho-compras-staging/frontend/dist;
    index index.html;

    # Frontend — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # Staging não pode ser indexado: seria uma segunda cópia da app nos
        # resultados de pesquisa, possivelmente com funcionalidades por testar.
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Os mesmos cabeçalhos de segurança da produção. Lembrete do nginx:
        # `add_header` dentro de um location descarta os herdados do server, por
        # isso qualquer cabeçalho novo tem de ser acrescentado aqui.
        #
        # A CSP não usa 'unsafe-inline' em script-src — é isso que a torna útil
        # contra XSS, e só é possível porque o arranque do Google Analytics vive
        # em /analytics.js e não inline no index.html.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    }

    # Backend de staging — porta 3001 (PORT no secret ENV_FILE_STAGING).
    # Sem add_header aqui: estes cabeçalhos vêm do @fastify/helmet, e duplicá-los
    # daria dois valores para o browser resolver.
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
