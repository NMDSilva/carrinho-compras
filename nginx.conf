# Configuração de REFERÊNCIA do nginx da VM — INCOMPLETA de propósito.
#
# ############################################################################
# # NÃO COPIAR ESTE FICHEIRO POR CIMA DA CONFIG DA VM.                       #
# ############################################################################
#
# Já aconteceu (31/08/2026): copiar este ficheiro para
# /etc/nginx/sites-available/carrinho-compras e recarregar o nginx deitou o site
# abaixo durante horas, com a Cloudflare a devolver 521 em tudo — site, API e o
# endpoint do n8n.
#
# Porquê: na VM, o bloco `listen 443 ssl` com os certificados Let's Encrypt vive
# DENTRO desse mesmo ficheiro (é o certbot que o escreve lá). Este ficheiro só
# tem `listen 80`, por isso substituí-lo apaga o listener de HTTPS. A Cloudflare
# está em modo Full: liga-se à origem por 443, deixa de ter com quem falar, e
# responde 521. O `nginx -t` passa e o `systemctl status` diz "running" — o
# nginx está mesmo bem, só que sem TLS. Nada nos diagnósticos óbvios aponta para
# o problema; confirma-se com `sudo ss -ltnp | grep -E ':(80|443)\b'`, que nesse
# estado só mostra a porta 80.
#
# Recuperação, se voltar a acontecer (não faz validação, não depende do site
# estar acessível):
#     sudo certbot install --cert-name carrinhodecompras.pt --nginx
#
# COMO USAR ESTE FICHEIRO: como referência do que deve existir no `location /` e
# no `location /api/`. Para aplicar uma alteração, edita o ficheiro na VM e
# acrescenta só as linhas em falta, mantendo o bloco 443 que lá está. Nunca
# substituas o ficheiro inteiro. Depois `sudo nginx -t` e
# `sudo systemctl reload nginx`, e confirma com
# `curl -sI https://carrinhodecompras.pt/` que continua a responder 200.
#
# Nenhum workflow aplica este ficheiro — o deploy só copia a app e reinicia o pm2.

server {
    # Na VM existe também um bloco `listen 443 ssl` com os certificados, gerido
    # pelo certbot, e um redirect de 80 -> 443. Não estão aqui porque este
    # ficheiro não é para ser copiado; ver o aviso acima.
    listen 80;
    server_name carrinhodecompras.pt www.carrinhodecompras.pt;

    root /home/silvanuno/carrinho-compras/frontend/dist;
    index index.html;

    # Frontend — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # Cabeçalhos de segurança da SPA. O @fastify/helmet só cobre as
        # respostas do backend (/api/), por isso o HTML e o JS da app ficavam
        # sem nada (achado de 31/08/2026 em AUDITORIA.md). Ficam neste location
        # e não ao nível do server para não duplicarem os que o helmet já
        # devolve em /api/.
        #
        # Nota do nginx: `add_header` num location descarta os herdados do
        # server — se for preciso acrescentar mais algum, tem de ser aqui.
        #
        # A CSP não usa `'unsafe-inline'` em script-src de propósito: é isso que
        # a torna útil contra XSS (o JWT vive em localStorage, um XSS dá conta
        # completa). O arranque do Google Analytics vive em /analytics.js
        # precisamente para não haver nenhum <script> inline no index.html —
        # se voltar a haver, a página deixa de carregar esse script.
        # `'unsafe-inline'` em style-src é inevitável: o Vue e o reka-ui
        # (Popover/Select/Dialog) posicionam-se com estilos inline.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        # A VM só recebe HTTP (o TLS termina na Cloudflare, que já serve o site
        # em HTTPS) — o HSTS é para o browser do visitante, não para este hop.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Backend API — sem add_header aqui: os cabeçalhos de segurança destas
    # respostas vêm do @fastify/helmet, e duplicá-los daria dois valores
    # (ex: dois X-Frame-Options) para o browser resolver.
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
