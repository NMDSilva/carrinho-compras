<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cart.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho de Compras</title>
    <!-- Bloqueante e antes dos estilos de propósito: aplica o tema guardado ao
         <html> antes do primeiro pixel, senão a página pinta em claro e salta
         para escuro. Tal como o analytics, vive num ficheiro e não inline, para
         a CSP poder usar script-src 'self' sem 'unsafe-inline'. -->
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Google Analytics — o arranque está em /analytics.js (e não inline) para
         a CSP do nginx poder usar script-src 'self' sem 'unsafe-inline'. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S4P6W0BTTF"></script>
    <script src="/analytics.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
